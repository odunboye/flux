name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Idris 2
        uses: sergeyshpadyrev/setup-idris@v1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build, test, and validate release assets
        run: make check
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: make browser-test
